<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game - Refactored</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui" class="ui-container">
            <div class="hud">
                <div class="hud-section hud-left">
                    <div class="stat-item">
                        <span class="label">HP:</span>
                        <div class="health-bar">
                            <div class="health-fill" id="healthBar"></div>
                        </div>
                        <span class="value" id="healthValue">100/100</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">SCORE:</span>
                        <span class="value" id="scoreValue">0</span>
                    </div>
                </div>
                
                <div class="hud-section hud-center">
                    <div class="radar">
                        <canvas id="radarCanvas" width="120" height="120"></canvas>
                    </div>
                </div>
                
                <div class="hud-section hud-right">
                    <div class="stat-item">
                        <span class="label">LEVEL:</span>
                        <span class="value" id="levelValue">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">ENEMIES:</span>
                        <span class="value" id="enemiesValue">0</span>
                    </div>
                </div>
            </div>
            
            <div class="controls-info">
                <p>WASD - движение | SPACE - атака | ESC - пауза</p>
            </div>
        </div>
    </div>

    <!-- Core Engine -->
    <script src="js/core/Engine.js"></script>
    <script src="js/core/Vector2D.js"></script>
    <script src="js/core/RenderSystem.js"></script>
    <script src="js/core/PhysicsSystem.js"></script>
    
    <!-- Graphics & Effects -->
    <script src="js/graphics/ShapeRenderer.js"></script>
    <script src="js/graphics/GlowEffect.js"></script>
    <script src="js/graphics/ParticleSystem.js"></script>
    <script src="js/graphics/AnimationSystem.js"></script>
    <script src="js/graphics/NebulaGenerator.js"></script>
    
    <!-- Game Objects -->
    <script src="js/entities/Entity.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/entities/Asteroid.js"></script>
    <script src="js/entities/Planet.js"></script>
    <script src="js/entities/Projectile.js"></script>
    
    <!-- Game Logic -->
    <script src="js/game/GameState.js"></script>
    <script src="js/game/GameManager.js"></script>
    <script src="js/game/InputManager.js"></script>
    
    <!-- Init -->
    <script src="js/app.js"></script>
</body>
</html>
